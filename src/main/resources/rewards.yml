# 结婚系统奖励配置；UTF-8 编码。全部支持 /marryadmin reload，校验失败保持上一份有效运行配置。
# 改动只影响以后生成的票据，不修改已领取或待领取的金币、经验、命令和名次。
# 每个奖励对象的公共字段：
# money：每位伴侣获得的金币，整数 0 至 Long.MAX_VALUE，缺省 0；需要 Vault 和经济服务。
# experience：每位伴侣的经验点数，整数 0 至 2147483647，缺省 0。
# commands：控制台执行的命令文本列表，默认 []；{player} 为领取者名称；不要填写敏感信息。
# 命令需要目标插件支持对应 Paper/Folia 环境；执行不可逆，领取中断需人工核对，不自动重试发放。
# 上述字段修改后 reload 生效，不追溯现有票据。

# 纪念日目录：键为已婚整天数（正整数）；默认 7/30/100/365。
# 每个关系每个纪念日为双方各发一次；已有目录不自动补回已删除的条目，{} 表示关闭。
# 发奖前在事务内重新核对当前关系和结婚天数；离婚冷静期暂停生成新票据，撤回后可继续。
# 同一纪念日双方缺失票据与标记同事务提交；已生成或已领取记录不会因离婚、reload 重发或删除。
anniversaries:
  # 第 7 天：默认每人 500 金币、100 经验，命令为空；reload 仅影响新票据。
  7: {money: 500, experience: 100, commands: []}
  # 第 30 天：默认每人 2000 金币、500 经验，命令为空；reload 仅影响新票据。
  30: {money: 2000, experience: 500, commands: []}
  # 第 100 天：默认每人 5000 金币、1000 经验，命令为空；reload 仅影响新票据。
  100: {money: 5000, experience: 1000, commands: []}
  # 第 365 天：默认每人 20000 金币、5000 经验，命令为空；reload 仅影响新票据。
  365: {money: 20000, experience: 5000, commands: []}
# 等级升级奖励预留目录，默认 {}；本版尚不执行此目录，不影响现有数据。
level-up: {}

# 周榜周期按 config.yml 的 timezone 计算，首次启用等待下一结算点。
# 到期后由 30 秒扫描结算；首次启用恰逢结算时刻可立即结算。
# 重启已有游标时只补最近一期，按首次恢复扫描的当前指标排序，不重建历史指标。
# 名单、双方票据、周期游标同事务提交；本期后续排名变化不追加奖励。
# 审计名单保留约 120 天；永久保留每榜单单调游标，待领取票据不因此删除。
weekly-top:
  # 启用周榜：true/false，默认 true。reload 生效；关闭保留票据与游标，恢复可补最近一期。
  enabled: true
  # 排序类型：bond/duration/online/total，默认 bond。reload 影响该榜单未来结算，历史票据不变。
  board: bond
  # 星期：MONDAY 至 SUNDAY，默认 SUNDAY。reload 后新时刻从下个结算点起使用，不回补历史。
  day-of-week: SUNDAY
  # 当地整点：整数 0-23，默认 20。reload 生效；修改时间不会重发已结算日期。
  hour: 20
  # 名次映射：键为 1-1000，默认前 3 名；允许只配置第 3 名等稀疏名次，{} 为不发周榜奖励。
  # reload 不补回服主删除的名次；修改金额只影响以后周期，每一项分别发给双方。
  rewards:
    # 第 1 名：默认每人 5000 金币、1000 经验、无命令。
    1: {money: 5000, experience: 1000, commands: []}
    # 第 2 名：默认每人 3000 金币、600 经验、无命令。
    2: {money: 3000, experience: 600, commands: []}
    # 第 3 名：默认每人 1500 金币、300 经验、无命令。
    3: {money: 1500, experience: 300, commands: []}
